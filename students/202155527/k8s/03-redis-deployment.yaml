apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-redis
  labels:
    app: guestbook
    component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: guestbook
      component: redis
  template:
    metadata:
      labels:
        app: guestbook
        component: redis
    spec:
      containers:
        - name: redis
          image: public.ecr.aws/docker/library/redis:7.2.17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
          args:
            - /etc/redis/redis.conf
            - --requirepass
            - "$(REDIS_PASSWORD)"
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guestbook-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q "^PONG$"'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q "^PONG$"'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q "^PONG$"'
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: guestbook-data
        - name: redis-config
          configMap:
            name: guestbook-redis-config
