apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-web
  labels:
    app: guestbook
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook
      component: web
  template:
    metadata:
      labels:
        app: guestbook
        component: web
    spec:
      containers:
        - name: web
          image: public.ecr.aws/docker/library/python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python3
          args:
            - /app/app.py
          env:
            - name: APP_TITLE
              valueFrom:
                configMapKeyRef:
                  name: guestbook-web-config
                  key: APP_TITLE
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: guestbook-web-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: guestbook-web-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guestbook-secret
                  key: REDIS_PASSWORD
            - name: PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: web-code
              mountPath: /app
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: web-code
          configMap:
            name: guestbook-web-config
            items:
              - key: app.py
                path: app.py
