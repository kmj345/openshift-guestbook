apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: guestbook-web
  labels:
    app: guestbook
    component: web
spec:
  to:
    kind: Service
    name: guestbook-web
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
